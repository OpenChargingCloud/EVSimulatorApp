# Dependabot version updates.
#
# Security updates and alerts are switched on in the repository settings and come from the
# dependency graph; nothing here turns them on or off. This file adds the weekly version updates,
# and the decisions that matter are what it leaves out.
#
# Capacitor is left out, in all three ecosystems. One Capacitor version is written in five places —
# @capacitor/* in shell/ and capacitor/ (npm), capacitor-swift-pm in capacitor/Package.swift and in
# the CLI-generated shell/ios/App/CapApp-SPM/Package.swift (SwiftPM), com.capacitorjs:core in
# capacitor/android (Gradle) — and they have to move together: the two SwiftPM pins are `exact`, so
# two different versions do not even resolve. Dependabot updates one ecosystem per pull request, so
# it would bump npm and leave the native pins behind, which is how the iOS shell came to link 8.5.0
# under npm's 8.6.0 (GHSA-rvm3-566m-v7fv, #51). Capacitor is bumped by hand, all five at once (#53).
# `ignore` limits version updates only: a Capacitor advisory still raises an alert.
#
# git submodules are left out: every gitlink move here is a deliberate step with its own commit.
#
# The cooldown holds a new release back for a week before a pull request offers it — a release
# pulled or found compromised in its first days never reaches a pull request. Security updates
# ignore the cooldown.
#
# What gates a pull request: the port gates (.github/workflows/port-gates.yml) run on every pull
# request and cover npm (capacitor/, app/), Gradle (kotlin/) and SwiftPM (swift/). NuGet has no
# automated gate here — `dotnet test` needs the ISO schemas — so a NuGet bump is checked with the
# conformance repository's suite before it is merged.

version: 2

updates:

  - package-ecosystem: "npm"
    directories:
      - "/app"
      - "/capacitor"
      - "/shell"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@capacitor/*"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # Kotlin and the Android Gradle plugin are written three times — kotlin/, capacitor/android and
  # shell/android (whose buildscript classpath is the one the consumed build actually uses) — and
  # capacitor/android/settings.gradle.kts says they are the same versions either way.
  #
  # Each build spells them differently, so to Dependabot they are different dependencies: Kotlin is
  # the plugin org.jetbrains.kotlin.jvm in kotlin/, org.jetbrains.kotlin.android plus
  # kotlin-test-junit in capacitor/android, and kotlin-gradle-plugin via ext.kotlinVersion in
  # shell/android; AGP is the plugin com.android.library in one and the classpath
  # com.android.tools.build:gradle in the other. A per-dependency group therefore split one Kotlin
  # bump into four pull requests on its first run (2026-11-28) and never offered the AGP classpath
  # at all — likely because the entry had reached its limit of five open pull requests. The one
  # minor-and-patch group below spans all three directories in a single pull request, which is
  # what keeps them together — so Kotlin and AGP stay in it. Before merging, check every site
  # moved:
  #
  #     git grep -nE 'kotlin\("jvm"\) version|kotlin.android"\) version|com.android.library"\)|kotlinVersion = |tools.build:gradle:|kotlin-test-junit:'
  #
  # shell/android is generated by the Capacitor CLI, and the Android Gradle plugin's major version
  # is Capacitor's to choose, so AGP majors are left to a Capacitor upgrade.
  - package-ecosystem: "gradle"
    directories:
      - "/kotlin"
      - "/capacitor/android"
      - "/shell/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "com.capacitorjs:*"
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # swift/ is the V2G package, tools/tls-nio-probe a probe with its own dependencies.
  #
  # capacitor/ is not listed, and it still needs a hand: Dependabot bumps a manifest's *direct*
  # dependencies, and capacitor/Package.swift has only two — capacitor-swift-pm (ignored above)
  # and the path dependency ../swift. Yet its Package.resolved pins everything ../swift brings
  # along: swift-certificates, swift-asn1, swift-crypto. So a pull request that moves one of those
  # in swift/Package.resolved leaves capacitor/Package.resolved behind; copy the new pin into it
  # (same identity, version, revision) before merging. Listing capacitor/ here would not change
  # that — it was listed at first, and the first swift-certificates pull request (#56) still
  # touched swift/ alone.
  #
  # shell/ios/App/CapApp-SPM is left out: the Capacitor CLI writes it, and it pins nothing but
  # Capacitor and the plugin.
  - package-ecosystem: "swift"
    directories:
      - "/swift"
      - "/tools/tls-nio-probe"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "github.com/ionic-team/capacitor-swift-pm"
    groups:
      swift-minor-and-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # Only this repository's own projects. Everything under libs/ is a submodule with its own
  # repository and its own updates.
  - package-ecosystem: "nuget"
    directories:
      - "/bridge/EVSimulatorApp.Bridge"
      - "/bridge/EVSimulatorApp.Bridge.Tests"
      - "/experiments/Vanaheimr.V2G.Experiments.Pqc"
      - "/pairing/EVSimulatorApp.Pairing"
      - "/pairing/EVSimulatorApp.Pairing.Tests"
      - "/pairing/EVSimulatorApp.Pi"
      - "/simulation/EVSimulatorApp.Ocpp"
      - "/tools/EVSimulatorApp.Codegen"
      - "/tools/EVSimulatorApp.Codegen.Tests"
      - "/tools/EVSimulatorApp.WsBridge"
      - "/tools/EVSimulatorApp.WsBridge.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    groups:
      # NUnit, its adapter and analyzers, and the test SDK are referenced by all four test
      # projects; one pull request moves them everywhere.
      test-framework:
        patterns:
          - "NUnit*"
          - "Microsoft.NET.Test.Sdk"
        group-by: "dependency-name"
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
