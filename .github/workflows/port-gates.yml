# The port gates: the suites that hold the Kotlin, Swift and TypeScript back ends to the C# side.
#
# One checkout, because this repository carries its own corpus. It did not always: the Kotlin and
# Swift suites used to read `../../ISO15118ConformanceTests.Simulation/Vectors/` — the conformance
# repository, the parent that carries this one as a submodule — so this workflow had to lay out the
# parent first and then this commit in the place the parent's gitlink points at, purely to put a
# directory of JSON above the tree under test. A submodule reading its superproject is a dependency
# pointing the wrong way, and the two-checkout dance was its cost. The corpus now lives in
# `vectors/` here and the conformance repository's `RegenerateTheCorpus` writes into it.
#
# What is deliberately absent: `dotnet test`. The C# build runs its source generators over the ISO
# schemas, which are ISO's and are not redistributed — a fresh clone fetches them with
# download-schemas.sh, and running that is a person accepting a licence. That gate lives with the
# conformance repository and its maintainer, not in an automated run here. None of the gates below
# needs a schema: every codec is generated and checked in, and so are the vectors.

name: Port gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  jvm-and-node:
    name: Kotlin · TypeScript · Capacitor · app
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive          # WWCP_ISO15118 holds the codec vectors

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The npm test scripts run `node --test` over .ts sources with no flag, so the floor is a Node
      # that strips types unflagged rather than the 22.6 that first offered it behind one.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: bash tools/port-gates.sh kotlin typescript capacitor app

  swift:
    name: Swift
    runs-on: macos-latest
    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: bash tools/port-gates.sh swift
