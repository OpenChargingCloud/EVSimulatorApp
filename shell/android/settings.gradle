include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'

// The Kotlin back end, as an included build.
//
// `capacitor.settings.gradle` (regenerated by `cap sync`) includes the plugin module, and that
// module depends on `cloud.charging.v2g:v2g-bridge` and `:v2g-session`. Nothing publishes those
// anywhere — they are substituted from source, which is what this line arranges. Without it the
// build looks for them on Maven Central and fails at `checkDebugAarMetadata`.
//
// The plugin's own `settings.gradle.kts` says the same thing for the standalone build; only one of
// the two files is ever read, and which one depends on who is building.
includeBuild('../../kotlin')
