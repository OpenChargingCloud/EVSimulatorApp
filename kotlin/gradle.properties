# The Kotlin daemon's inherited default is not enough to compile the -20 codecs, and the failure
# ("Not enough memory to run compilation") moves between modules with build order, so it is
# pressure across the build rather than one bad file.
#
# 1 GB is measured, not guessed: 512m still fails on acdersae, dc and wpt; 1g builds everything.
# Before the emitter split its output per type this needed 4 GB — a codec was one ~1 MB file then.
kotlin.daemon.jvmargs=-Xmx1g
