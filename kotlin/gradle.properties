# The generated -20 DER codecs are ~1 MB each, in a single file. The Kotlin compiler runs out of
# heap on them at the default daemon size (GC overhead limit exceeded), and the failure moves
# between modules depending on build order, so it is memory pressure rather than one bad file.
#
# This is a stopgap. The real fix is per-type file splitting in the emitter, which the plan already
# calls for to stay under Android's DEX method limits — the compiler is simply hitting a wall first.
org.gradle.jvmargs=-Xmx4g
kotlin.daemon.jvmargs=-Xmx4g
