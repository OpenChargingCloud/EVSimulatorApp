# Read only when this module is built on its own; inside an application the app's own
# gradle.properties is the one Gradle reads, and Capacitor's generated project sets both of these.
#
# AGP 8 requires the flag to be explicit — Capacitor's core is AndroidX all the way down, so without
# it the unit tests do not even resolve. (AGP 9 defaults it on, which is how an earlier draft of this
# module passed without ever saying so.)
android.useAndroidX=true

org.gradle.jvmargs=-Xmx2048m
